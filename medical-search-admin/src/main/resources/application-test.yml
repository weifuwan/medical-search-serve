spring:
  datasource:
    druid:
      #MySQL
      driver-class-name: com.mysql.cj.jdbc.Driver
      url: jdbc:mysql://192.168.1.115:3306/medical_search_biz?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&nullCatalogMeansCurrent=true
      username: root
      password: dataincite
      initial-size: 10
      max-active: 100
      min-idle: 10
      max-wait: 6000
      pool-prepared-statements: true
      max-pool-prepared-statement-per-connection-size: 20
      time-between-eviction-runs-millis: 60000
      min-evictable-idle-time-millis: 300000
      test-while-idle: true
      test-on-borrow: false
      test-on-return: false
      stat-view-servlet:
        enabled: true
        url-pattern: /druid/*
  elasticsearch:
    uris: http://192.168.1.112:9200
    username: elastic
    password: es123456
  redis:
    database: 0
    host: 192.168.1.113
    port: 6379
    timeout: 6000ms  # 连接超时时长（毫秒）
    jedis:
      pool:
        max-active: 1000  # 连接池最大连接数（使用负值表示没有限制）
        max-wait: -1ms      # 连接池最大阻塞等待时间（使用负值表示没有限制）
        max-idle: 10      # 连接池中的最大空闲连接
        min-idle: 5       # 连接池中的最小空闲连接

# 是否开启redis缓存  true开启   false关闭
custom:
  redis:
    open: true
  login-captcha:
    isDisabled: false
  file:
    path: /opt/module/medical-search-serve/mz_upload_file
    #单位（M）
    imageSize: 1
  user:
    # 用户默认密码
    default-password: 123456
  # 数据保存记录-回收站保存过期天数
  recycle-bin:
    expire: 15
  es:
    # es索引名称
    index-name: cdr_medical_search_all
    # 导出缓存文件路径
    export-cache-path: /opt/module/medical-search-serve/export


logging:
  level:
    root: info

